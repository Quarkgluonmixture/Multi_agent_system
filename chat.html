<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Multi AI Chat</title>
  <style>
    * { box-sizing: border-box; }

    /* ===== light theme (default) ===== */
    body {
      --bg:             #fafafa;
      --panel-bg:       #ffffff;
      --text:           #222222;
      --text-dim:       #888888;
      --text-muted:     #aaaaaa;
      --border:         #dddddd;
      --border-soft:    #eeeeee;
      --code-bg:        #f0f0f2;
      --link:           #2563eb;

      --input-bg:       #ffffff;
      --input-border:   #cccccc;
      --input-focus:    #2563eb;

      --user-bg:        #2563eb;
      --user-text:      #ffffff;

      --assistant-bg:   #ffffff;
      --assistant-border: #dddddd;

      --thinking-bg:    #fff7e6;
      --thinking-border:#f3c977;
      --thinking-text:  #8a6d2c;

      --error-bg:       #ffe9e9;
      --error-border:   #f3a8a8;
      --error-text:     #aa3333;

      --round-bg:       #f7f7f7;
      --round-border:   #cccccc;

      --header-bg:      #ffffff;
      --footer-bg:      #ffffff;

      --button-bg:      #ffffff;
      --button-border:  #cccccc;
      --button-hover:   #f0f0f0;
      --button-text:    #555555;

      --send-bg:        #2563eb;
      --send-text:      #ffffff;
      --send-disabled:  #aaaaaa;
    }

    /* ===== dark theme ===== */
    body[data-theme="dark"] {
      --bg:             #18181b;
      --panel-bg:       #232327;
      --text:           #e5e5e5;
      --text-dim:       #999999;
      --text-muted:     #666666;
      --border:         #3a3a3e;
      --border-soft:    #2c2c2f;
      --code-bg:        #1a1a1d;
      --link:           #60a5fa;

      --input-bg:       #2a2a2e;
      --input-border:   #444444;
      --input-focus:    #60a5fa;

      --user-bg:        #2563eb;
      --user-text:      #ffffff;

      --assistant-bg:   #27272a;
      --assistant-border: #3a3a3e;

      --thinking-bg:    #2a2418;
      --thinking-border:#6b5634;
      --thinking-text:  #d4b074;

      --error-bg:       #3a1818;
      --error-border:   #6b3434;
      --error-text:     #f3a8a8;

      --round-bg:       #1f1f22;
      --round-border:   #3a3a3e;

      --header-bg:      #1f1f22;
      --footer-bg:      #1f1f22;

      --button-bg:      #2a2a2e;
      --button-border:  #444444;
      --button-hover:   #353539;
      --button-text:    #d0d0d0;

      --send-bg:        #2563eb;
      --send-text:      #ffffff;
      --send-disabled:  #555555;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      transition: background-color 0.12s, color 0.12s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .header .actions {
      display: flex;
      gap: 6px;
    }
    .header button {
      font-size: 11px;
      padding: 3px 8px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      border-radius: 3px;
      cursor: pointer;
      color: var(--button-text);
    }
    .header button:hover { background: var(--button-hover); }

    .provider-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px 10px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      align-items: center;
      flex-shrink: 0;
    }
    .provider-bar.tight { padding-top: 4px; padding-bottom: 4px; }
    .provider-bar .pb-label {
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .provider-bar select {
      font-size: 11px;
      padding: 2px 6px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
    }
    .provider-bar .final-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .provider-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--button-bg);
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.1s;
    }
    .provider-pill:disabled {
      cursor: not-allowed;
    }
    .provider-pill[data-enabled="true"] { color: white; }
    .provider-pill[data-enabled="true"][data-provider="chatgpt"]  { background: #10a37f; border-color: #0e8a6a; }
    .provider-pill[data-enabled="true"][data-provider="gemini"]   { background: #4285f4; border-color: #3675db; }
    .provider-pill[data-enabled="true"][data-provider="deepseek"] { background: #6366f1; border-color: #5557d8; }
    .provider-pill[data-enabled="true"][data-provider="kimi"]     { background: #a855f7; border-color: #9745da; }
    .provider-pill[data-enabled="false"] {
      text-decoration: line-through;
      opacity: 0.55;
    }
    .provider-pill .role {
      font-size: 9px;
      font-weight: normal;
      opacity: 0.78;
      margin-left: 5px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
    }

    .empty-hint {
      color: var(--text-muted);
      text-align: center;
      margin-top: 30vh;
      font-size: 13px;
      line-height: 1.5;
      padding: 0 16px;
    }

    .msg {
      max-width: 88%;
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.55;
      word-wrap: break-word;
      position: relative;
    }

    /* hover toolbar (edit / regenerate) */
    .msg-tools {
      position: absolute;
      top: -10px;
      right: 6px;
      display: flex;
      gap: 1px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px;
      opacity: 0;
      transition: opacity 0.12s;
      pointer-events: none;
      z-index: 2;
    }
    .msg:hover .msg-tools { opacity: 1; pointer-events: auto; }
    .msg-tools button {
      background: transparent;
      border: none;
      padding: 3px 5px;
      cursor: pointer;
      color: var(--text-dim);
      border-radius: 10px;
      display: flex;
      align-items: center;
    }
    .msg-tools button:hover {
      color: var(--text);
      background: var(--button-hover);
    }
    .msg-tools svg { width: 12px; height: 12px; display: block; }
    body.pipeline-running .msg-tools { display: none; }
    .msg.editing .msg-tools { display: none; }
    .msg.queued .msg-tools { display: none; }

    /* in-place editor for user messages */
    .edit-area { width: 100%; }
    .edit-area textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 60px;
      max-height: 240px;
      resize: vertical;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .edit-area textarea:focus { border-color: rgba(255, 255, 255, 0.55); }
    .edit-buttons {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      justify-content: flex-end;
    }
    .edit-buttons button {
      font-size: 11px;
      padding: 3px 12px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: transparent;
      color: white;
      cursor: pointer;
      font-family: inherit;
    }
    .edit-buttons button.edit-save {
      background: rgba(255, 255, 255, 0.22);
      font-weight: 500;
    }
    .edit-buttons button.edit-save:hover { background: rgba(255, 255, 255, 0.32); }
    .edit-buttons button.edit-cancel:hover { background: rgba(255, 255, 255, 0.1); }

    .msg.user.editing > .markdown,
    .msg.user.editing > div:not(.edit-area):not(.msg-tools) { display: none; }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
      white-space: pre-wrap;
    }
    .msg.user.queued {
      opacity: 0.55;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .msg.user.queued::before {
      content: '排队中 · ';
      font-size: 10px;
      letter-spacing: 0.05em;
      opacity: 0.85;
      display: block;
      margin-bottom: 2px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      border: 1px solid var(--assistant-border);
      color: var(--text);
      max-width: 95%;
    }

    /* ===== Markdown rendering inside assistant bubbles ===== */
    .markdown { font-size: 14px; }
    .markdown > *:first-child { margin-top: 0; }
    .markdown > *:last-child { margin-bottom: 0; }
    .markdown h1, .markdown h2, .markdown h3,
    .markdown h4, .markdown h5, .markdown h6 {
      font-weight: 700;
      margin: 14px 0 6px;
      line-height: 1.25;
    }
    .markdown h1 { font-size: 21px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .markdown h2 { font-size: 18px; }
    .markdown h3 { font-size: 16px; }
    .markdown h4 { font-size: 14px; }
    .markdown h5, .markdown h6 { font-size: 13px; }
    .markdown strong { font-weight: 700; }
    .markdown p { margin: 6px 0; }
    .markdown ul, .markdown ol { margin: 6px 0; padding-left: 22px; }
    .markdown li { margin: 2px 0; }
    .markdown li > p { margin: 2px 0; }
    .markdown em { font-style: italic; }
    .markdown a { color: var(--link); text-decoration: underline; }
    .markdown blockquote {
      border-left: 3px solid var(--border);
      padding: 2px 0 2px 10px;
      color: var(--text-dim);
      margin: 6px 0;
    }
    .markdown hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }
    .markdown code {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
      font-size: 12.5px;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .markdown pre {
      background: var(--code-bg);
      padding: 8px 10px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 6px 0;
      font-size: 12.5px;
      line-height: 1.4;
    }
    .markdown pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      display: block;
      white-space: pre;
    }
    .msg.thinking {
      align-self: flex-start;
      background: var(--thinking-bg);
      border: 1px dashed var(--thinking-border);
      color: var(--thinking-text);
      font-style: italic;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .msg.error {
      align-self: flex-start;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      white-space: pre-wrap;
    }

    /* streaming cursor on in-progress assistant message */
    .msg.assistant.streaming .markdown::after {
      content: '▍';
      display: inline-block;
      margin-left: 1px;
      color: var(--text-dim);
      animation: stream-blink 0.95s steps(2) infinite;
      vertical-align: baseline;
    }
    @keyframes stream-blink {
      0%   { opacity: 1; }
      50%  { opacity: 0.25; }
      100% { opacity: 1; }
    }

    details.rounds {
      margin-top: 10px;
      border-top: 1px dashed var(--border);
      padding-top: 6px;
      font-size: 11px;
    }
    details.rounds summary {
      cursor: pointer;
      color: var(--text-dim);
      font-weight: 500;
      list-style: none;
    }
    details.rounds summary::before { content: '▸ '; }
    details.rounds[open] summary::before { content: '▾ '; }

    .round-block { margin-top: 8px; }
    .round-title {
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .round-item {
      margin-bottom: 6px;
      padding: 6px 8px;
      background: var(--round-bg);
      border-radius: 4px;
      border-left: 2px solid var(--round-border);
      font-size: 11px;
      color: var(--text);
    }
    .round-item .pname {
      font-weight: 600;
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 3px;
    }
    .round-item[data-provider="chatgpt"]  { border-left-color: #10a37f; }
    .round-item[data-provider="gemini"]   { border-left-color: #4285f4; }
    .round-item[data-provider="deepseek"] { border-left-color: #6366f1; }
    .round-item .ptext {
      max-height: 220px;
      overflow-y: auto;
    }
    .round-item .ptext.markdown { font-size: 11px; }

    .input-bar {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--panel-bg);
      padding: 8px;
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }
    .input-bar textarea {
      flex: 1;
      min-height: 38px;
      max-height: 200px;
      resize: none;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 8px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
    }
    .input-bar textarea:focus { border-color: var(--input-focus); }
    .input-bar textarea::placeholder { color: var(--text-muted); }

    .input-bar button.send,
    .input-bar button.stop {
      padding: 8px 14px;
      color: var(--send-text);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .input-bar button.send {
      background: var(--send-bg);
    }
    .input-bar button.send:disabled {
      background: var(--send-disabled);
      cursor: not-allowed;
    }
    .input-bar button.stop {
      background: #dc2626;
    }
    .input-bar button.stop:hover { background: #b91c1c; }
    .input-bar button[hidden] { display: none; }

    .footer-hint {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      padding: 4px 8px;
      background: var(--footer-bg);
      border-top: 1px solid var(--border-soft);
    }

    /* scrollbar styling for dark mode */
    body[data-theme="dark"] ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    body[data-theme="dark"] ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    body[data-theme="dark"] ::-webkit-scrollbar-thumb {
      background: #3a3a3e;
      border-radius: 4px;
    }
    body[data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
      background: #4a4a4e;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Multi AI Chat · v0.47</h1>
    <div class="actions">
      <button id="fullscreen-btn" title="进入全屏（再点退出）">全屏</button>
      <button id="toggle-grid-btn" title="显示 / 隐藏底部的 4 个 AI iframe（debug 用）">看 Grid</button>
      <button id="theme-btn" title="切换主题">深色</button>
      <button id="clear-btn" title="清空对话">新对话</button>
      <button id="copy-debug" title="复制 debug 信息">Debug</button>
    </div>
  </div>

  <div class="provider-bar tight" id="provider-bar">
    <span class="pb-label" title="参与 R1 + R2 互相 review 的模型，至少 2 个">参与</span>
    <button class="provider-pill" data-provider="chatgpt"  data-enabled="true">ChatGPT<span class="role">杠精</span></button>
    <button class="provider-pill" data-provider="gemini"   data-enabled="true">Gemini<span class="role">串子</span></button>
    <button class="provider-pill" data-provider="deepseek" data-enabled="true">DeepSeek<span class="role">懂王</span></button>
    <button class="provider-pill" data-provider="kimi"     data-enabled="true">Kimi<span class="role">打工人</span></button>
    <div class="final-group" title="最终主编：读三家 R2 输出做合成。可以不在&quot;参与&quot;里">
      <span class="pb-label">合成</span>
      <select id="final-editor">
        <option value="chatgpt">ChatGPT</option>
        <option value="gemini" selected>Gemini</option>
        <option value="deepseek">DeepSeek</option>
        <option value="kimi">Kimi</option>
      </select>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-hint" id="empty-hint">
      给三家 AI 提个问题，它们会先各自独立回答，再交叉评审，最后由 Gemini 合成最终答案。
    </div>
  </div>

  <div class="input-bar">
    <textarea id="prompt" rows="2" placeholder="输入消息，Shift+Enter 换行..."></textarea>
    <button class="send" id="send-btn">发送</button>
    <button class="stop" id="stop-btn" hidden>停止</button>
  </div>

  <div class="footer-hint">
    每条消息跑 R1 → R2 → Final 三轮，约 50-80s。4 个 AI iframe 嵌在本 tab 底部隐藏区——不再开独立窗口。
  </div>

  <!-- Embedded grid section. Hidden via clip-path: inset(100%) — the
       element occupies normal viewport coordinates (so Chrome's
       IntersectionObserver considers it "intersecting" and doesn't throttle
       iframe rAF/rendering priority), and computed CSS shows
       visibility:visible / opacity:1 (so Gemini's anti-bot checks pass),
       but visually nothing paints because the entire content is clipped.
       History of failed alternatives:
         - visibility:hidden  → throttled (CG/DS slow)
         - opacity:0          → broke Gemini submit (anti-bot)
         - left:-2000px       → off-viewport slowed CG/DS again
       clip-path:inset(100%) is the four-quadrant winner. -->
  <div id="bg-grid-section" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 1280px;
    height: 900px;
    clip-path: inset(100%);
    pointer-events: none;
    background: #18181b;
  ">
    <div style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; width: 100%; height: 100%;">
      <iframe id="cg" data-provider="chatgpt" src="https://chatgpt.com/?temporary-chat=true" style="width:100%;height:100%;border:0;background:white;"></iframe>
      <iframe id="g" data-provider="gemini" src="https://gemini.google.com/app" style="width:100%;height:100%;border:0;background:white;"></iframe>
      <iframe id="ds" data-provider="deepseek" src="https://chat.deepseek.com/" style="width:100%;height:100%;border:0;background:white;"></iframe>
      <iframe id="km" data-provider="kimi" src="https://www.kimi.com/" style="width:100%;height:100%;border:0;background:white;"></iframe>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
